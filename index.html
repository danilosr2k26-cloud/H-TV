*{box-sizing:border-box}body{margin:0;background:#080906;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100svh;display:grid;place-items:center;padding:32px 18px;position:relative;isolation:isolate}
.backdrop{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-3;filter:blur(5px);opacity:.38}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.87));z-index:-2}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 15%,#e7dc1422,transparent 65%);z-index:-1}
main{text-align:center;width:min(100%,490px);padding:36px 28px 28px;background:rgba(13,15,10,.92);border:1px solid #e3d92740;border-radius:28px;box-shadow:0 28px 100px #0009}
.brand{display:inline-flex;align-items:center;gap:10px;color:#eee435;font-size:26px;font-weight:900;letter-spacing:1px}.play{width:34px;height:34px;border-radius:10px;background:#eee435;display:grid;place-items:center}.play:after{content:"";border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid #111;margin-left:3px}
.eyebrow{font-size:11px;letter-spacing:2.2px;color:#b8b9a7;margin:23px 0 12px;font-weight:700}
h1{font-size:clamp(28px,6vw,38px);line-height:1.12;margin:0 0 14px;letter-spacing:-1px}h1 span{color:#eee435}
.intro{font-size:16px;color:#d1d2c6;line-height:1.6;margin:0 auto 24px;max-width:345px}
.qr{background:white;border-radius:20px;padding:24px;width:min(100%,286px);margin:auto;box-shadow:0 0 0 7px #ece3350a}.qr img,.qr canvas{display:block;width:100%;height:auto;aspect-ratio:1}
.steps{display:flex;justify-content:center;align-items:center;gap:8px;margin:24px 0 18px;font-size:13px;color:#dcddce}.stepnum{background:#ece335;color:#111;border-radius:50%;width:21px;height:21px;display:inline-grid;place-items:center;font-size:11px;font-weight:bold}.arrow{color:#747767;padding:0 4px}
.note{margin:0;padding-top:17px;border-top:1px solid #ffffff13;font-size:12px;color:#a8ab96;line-height:1.5}
@media(max-width:380px){main{padding:28px 18px}.steps{font-size:11px;gap:5px}body{padding:18px 12px}}

<script>
const container = document.getElementById("qrcode");
try {
  const link = new URL(LINK_QR_CODE);
  if (!["https:", "http:"].includes(link.protocol)) throw new Error("Use http ou https");
  new QRCode(container, {
    text: LINK_QR_CODE,
    width: 256,
    height: 256,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
  if (LINK_QR_CODE !== "https://example.com") {
    document.querySelector(".note").textContent = "Aponte a câmera para o código acima.";
  }
} catch (error) {
  container.textContent = "Configure um link válido em LINK_QR_CODE.";
  container.style.color = "#111";
}
</script>
